name: whistler

on:
  schedule:
    - cron: "*/20 0-7,14-23 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "whistler/**"
      - ".github/workflows/whistler.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s whistler -p "test_*.py"
      - name: Scrape
        run: python -u whistler/scrape.py
      - name: Upload inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whistler
          path: whistler/
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: whistler

  # Separate job so the github-pages environment is only touched on main.
  # It runs only if the scrape job succeeded, so a failed scrape leaves the
  # last good site live.
  deploy:
    needs: scrape
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
